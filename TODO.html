<!-- To-Do List
Author: Evan Barrett -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body { font-family: sans-serif; max-width: 450px; margin: 40px auto; padding: 0 20px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] { flex: 1; padding: 8px; font-size: 14px; }
    button { padding: 6px 10px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #ddd; }
    .task-text { flex: 1; cursor: pointer; }
    .completed { text-decoration: line-through; color: #ff0000; }
  </style>
</head>
<body>

  <h1>To-Do List</h1>
  
  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Enter a new task...">
    <button onclick="addTask()">Add</button>
  </div>

  <ul id="taskList"></ul>

  <script>
    // Array to hold our tasks
    let tasks = [];

    // Render the tasks array into the HTML list
    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');

        // Task text (click to toggle completion)
        const span = document.createElement('span');
        span.textContent = task.text;
        span.className = 'task-text ' + (task.completed ? 'completed' : '');
        span.onclick = () => toggleComplete(index);

        // Move Up button
        const upBtn = document.createElement('button');
        upBtn.textContent = '↑';
        upBtn.disabled = index === 0;
        upBtn.onclick = () => moveTask(index, -1);

        // Move Down button
        const downBtn = document.createElement('button');
        downBtn.textContent = '↓';
        downBtn.disabled = index === tasks.length - 1;
        downBtn.onclick = () => moveTask(index, 1);

        // Delete button
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '✕';
        deleteBtn.onclick = () => removeTask(index);

        li.append(span, upBtn, downBtn, deleteBtn);
        list.appendChild(li);
      });
    }

    // Add a new task
    function addTask() {
      const input = document.getElementById('taskInput');
      // Trims entries and refuses blanks
      const text = input.value.trim();
      if (text !== '') {
        tasks.push({ text: text, completed: false });
        input.value = '';
        renderTasks();
      }
    }

    // Allow hitting "Enter" to add a task
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addTask();
    });

    // Mark or unmark a task as completed
    function toggleComplete(index) {
      tasks[index].completed = !tasks[index].completed;
      renderTasks();
    }

    // Remove a task
    function removeTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    // Rearrange tasks by swapping positions in the array
    function moveTask(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex >= 0 && targetIndex < tasks.length) {
        const temp = tasks[index];
        tasks[index] = tasks[targetIndex];
        tasks[targetIndex] = temp;
        renderTasks();
      }
    }

  
  </script>

</body>
</html>
